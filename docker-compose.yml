services:
  frontend:
    build: .
    image: profile-frontend:local
    container_name: profile-frontend-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:13040:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
